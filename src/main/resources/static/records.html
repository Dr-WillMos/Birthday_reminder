<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日提醒 | 提醒记录</title>
    <!-- Bootstrap CSS -->
   <link href="/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义CSS -->
    <link href="/css/style.css" rel="stylesheet">
    <!-- Font Awesome 图标 -->
    <link href="/css/font-awesome.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">生日提醒</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="ship.html">亲友管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reminders.html">提醒计划</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="records.html">提醒记录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card mb-4">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h2 style="margin-bottom: 0.5rem;">
                            <i class="fas fa-history me-2" style="color: #667eea;"></i>提醒记录
                        </h2>
                        <p class="text-muted mb-0">查看您的历史提醒记录</p>
                    </div>
                    <div class="col-md-6 text-end">
                        <button type="button" class="btn btn-primary" id="refreshBtn">
                            <i class="fas fa-sync-alt me-2"></i>刷新
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 搜索和筛选 -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="input-group">
                    <span class="input-group-text" style="background: white; border-right: 0;">
                        <i class="fas fa-filter text-muted"></i>
                    </span>
                    <select class="form-select" id="relationshipFilter" style="border-left: 0; border-right: 0;">
                        <option value="">所有亲友</option>
                        <!-- 亲友选项将通过JavaScript动态加载 -->
                    </select>
                    <button class="btn btn-outline-secondary" type="button" id="filterBtn">
                        <i class="fas fa-filter me-1"></i>筛选
                    </button>
                </div>
            </div>
            <div class="col-md-4">
                <select class="form-select" id="statusFilter">
                    <option value="">所有状态</option>
                    <option value="PENDING">待处理</option>
                    <option value="PROCESSED">已处理</option>
                </select>
            </div>
        </div>

        <!-- 提醒记录表格 -->
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>亲友</th>
                        <th>提醒类型</th>
                        <th>提醒日期</th>
                        <th>提醒消息</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="recordTableBody">
                    <!-- 数据将通过JavaScript动态加载 -->
                </tbody>
            </table>
        </div>

        <!-- 分页控件 -->
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- 分页将通过JavaScript动态加载 -->
            </ul>
        </nav>
    </div>

    <!-- 页脚 -->
    <footer class="py-4 mt-5">
        <div class="container text-center">
            <p class="mb-2" style="font-size: 1.1rem;">任何不曾起舞的日子，都是对生命的辜负</p>
            <p class="mb-0 small text-muted">© 2024 生日提醒系统 | 用心记住每一个重要时刻</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
        <script src="/js/bootstrap.bundle.min.js" ></script>
    <!-- API JS -->
    <script src="/js/api.js"></script>
    <!-- 提醒记录JS -->
    <script src="/js/records.js"></script>
</body>
</html>
