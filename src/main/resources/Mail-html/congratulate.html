<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日祝福</title>
    <style>
        :root {
            --primary-color: #ff6b9d;
            --secondary-color: #ffc371;
            --light-bg: #fff5f7;
            --text-dark: #333;
            --text-light: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--text-light);
            text-align: center;
            padding: 50px 30px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '🎉';
            position: absolute;
            font-size: 100px;
            opacity: 0.1;
            top: -20px;
            left: -20px;
            animation: rotate 20s linear infinite;
        }

        .header::after {
            content: '🎁';
            position: absolute;
            font-size: 80px;
            opacity: 0.1;
            bottom: -10px;
            right: -10px;
            animation: rotate 15s linear infinite reverse;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
        }

        .greeting {
            font-size: 20px;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 20px;
        }

        .cake-icon {
            font-size: 80px;
            margin: 20px 0;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .message {
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-dark);
            margin: 30px 0;
            padding: 20px;
            background: var(--light-bg);
            border-radius: 15px;
            border-left: 4px solid var(--primary-color);
        }

        .wish-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin: 30px 0;
            font-size: 16px;
            line-height: 1.8;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .signature {
            text-align: right;
            font-size: 16px;
            color: #666;
            margin-top: 30px;
            font-style: italic;
        }

        .footer {
            background: #f8f9fa;
            text-align: center;
            padding: 25px;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #e9ecef;
        }

        .balloons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            font-size: 40px;
        }

        .balloon {
            animation: float 3s ease-in-out infinite;
        }

        .balloon:nth-child(2) {
            animation-delay: 0.5s;
        }

        .balloon:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @media screen and (max-width: 600px) {
            .header {
                padding: 40px 20px;
            }

            .header h1 {
                font-size: 26px;
            }

            .content {
                padding: 30px 20px;
            }

            .greeting {
                font-size: 18px;
            }

            .cake-icon {
                font-size: 60px;
            }

            .message {
                font-size: 16px;
                padding: 15px;
            }

            .wish-box {
                font-size: 15px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎂 生日快乐 🎂</h1>
        </div>
        <div class="content">
            <div class="greeting">{greeting}{relationshipName}</div>
            
            <div class="cake-icon">🎂</div>
            
            <div class="balloons">
                <span class="balloon">🎈</span>
                <span class="balloon">🎈</span>
                <span class="balloon">🎈</span>
            </div>
            
            <div class="message">
                今天是你的生日，特别的日子里<br>
                愿你拥有最美好的祝愿<br>
                愿所有的快乐、所有的幸福、所有的温馨、所有的好运永远围绕在你身边！
            </div>
            
            <div class="wish-box">
                ✨ 祝你生日快乐！✨<br><br>
                愿你的每一天都充满阳光<br>
                愿你的每个愿望都能实现<br>
                愿你永远健康、快乐、幸福<br><br>
                🎉 Happy Birthday! 🎉
            </div>
            
            <div class="signature">
                —— {selfCall}
            </div>
        </div>
        <div class="footer">
            <p style="margin-bottom: 10px;">🎁 这是一份来自朋友的特别祝福 🎁</p>
            <p style="font-size: 12px; color: #999;">愿你的生命里充满欢乐与惊喜</p>
        </div>
    </div>
</body>
</html>
