<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日提醒 | 提醒计划</title>
    <!-- Bootstrap CSS -->
  <link href="/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义CSS -->
    <link href="/css/style.css" rel="stylesheet">
    <!-- Font Awesome 图标 -->
    <link href="/css/font-awesome.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">生日提醒</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="ship.html">亲友管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="reminders.html">提醒计划</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="records.html">提醒记录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card mb-4">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h2 style="margin-bottom: 0.5rem;">
                            <i class="fas fa-bell me-2" style="color: #667eea;"></i>提醒计划
                        </h2>
                        <p class="text-muted mb-0">管理您的生日提醒计划</p>
                    </div>
                    <div class="col-md-6 text-end">
                        <button type="button" class="btn btn-primary" id="addReminderBtn">
                            <i class="fas fa-plus me-2"></i>添加提醒计划
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 搜索和筛选 -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="input-group">
                    <span class="input-group-text" style="background: white; border-right: 0;">
                        <i class="fas fa-filter text-muted"></i>
                    </span>
                    <select class="form-select" id="relationshipFilter" style="border-left: 0; border-right: 0;">
                        <option value="">所有亲友</option>
                        <!-- 亲友选项将通过JavaScript动态加载 -->
                    </select>
                    <button class="btn btn-outline-secondary" type="button" id="filterBtn">
                        <i class="fas fa-filter me-1"></i>筛选
                    </button>
                </div>
            </div>
            <div class="col-md-4">
                <select class="form-select" id="statusFilter">
                    <option value="">所有状态</option>
                    <option value="ACTIVE">活跃</option>
                    <option value="INACTIVE">未激活</option>
                </select>
            </div>
        </div>

        <!-- 提醒计划表格 -->
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>亲友</th>
                        <th>提醒类型</th>
                        <th>提醒日期</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="reminderTableBody">
                    <!-- 数据将通过JavaScript动态加载 -->
                </tbody>
            </table>
        </div>

        <!-- 分页控件 -->
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- 分页将通过JavaScript动态加载 -->
            </ul>
        </nav>
    </div>

    <!-- 添加/编辑提醒计划模态框 -->
    <div class="modal fade" id="reminderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">添加提醒计划</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="reminderForm">
                        <input type="hidden" id="reminderId">
                        <div class="mb-3">
                            <label for="relationshipId" class="form-label">亲友</label>
                            <select class="form-select" id="relationshipId" required>
                                <!-- 亲友选项将通过JavaScript动态加载 -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="reminderType" class="form-label">提醒类型</label>
                            <select class="form-select" id="reminderType" required>
                                <option value="BIRTHDAY">生日提醒</option>
                                <option value="CUSTOM">自定义提醒</option>
                            </select>
                        </div>
                        <div class="mb-3" id="customDateGroup">
                            <label for="reminderDate" class="form-label">提醒日期</label>
                            <input type="date" class="form-control" id="reminderDate">
                        </div>
                        <div class="mb-3">
                            <label for="advanceDays" class="form-label">提前提醒天数</label>
                            <input type="number" class="form-control" id="advanceDays" min="0" value="3">
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">提醒消息</label>
                            <textarea class="form-control" id="message" rows="3"></textarea>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="active" checked>
                            <label class="form-check-label" for="active">激活提醒</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveReminder">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="py-4 mt-5">
        <div class="container text-center">
            <p class="mb-2" style="font-size: 1.1rem;">任何不曾起舞的日子，都是对生命的辜负</p>
            <p class="mb-0 small text-muted">© 2024 生日提醒系统 | 用心记住每一个重要时刻</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
        <script src="/js/bootstrap.bundle.min.js" ></script>
    <!-- API JS -->
    <script src="/js/api.js"></script>
    <!-- 提醒计划JS -->
    <script src="/js/reminders.js"></script>
</body>
</html>
