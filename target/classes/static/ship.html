<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日提醒 - 亲友管理</title>
    <!-- Bootstrap CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="/css/font-awesome.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">生日提醒</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">首页</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="ship.html">亲友管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="reminders.html">提醒计划</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="records.html">提醒记录</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Toast 通知容器 -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 9999;">
    <div id="toastContainer"></div>
</div>

<!-- 主要内容 -->
<div class="container my-4">
    <div class="card mb-4">
        <div class="card-body">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h2 style="margin-bottom: 0.5rem;">
                        <i class="fas fa-users me-2" style="color: #667eea;"></i>亲友管理
                    </h2>
                    <p class="text-muted mb-0">管理您的重要人际关系信息</p>
                </div>
                <div class="col-md-6 text-end">
                    <button class="btn btn-primary" data-bs-toggle="modal" id="addRelationshipBtn" data-bs-target="#relationshipModal">
                        <i class="fas fa-plus me-2"></i>添加亲友
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 搜索和筛选 -->
    <div class="row mb-4">
        <div class="col-md-8">
            <div class="input-group">
                <span class="input-group-text" style="background: white; border-right: 0;">
                    <i class="fas fa-search text-muted"></i>
                </span>
                <input type="text" class="form-control" placeholder="搜索亲友姓名..." id="searchInput" style="border-left: 0;">
                <select class="form-select" id="tagFilter" style="max-width: 150px;">
                    <option value="">所有亲友</option>
                    <option value="家人">家人</option>
                    <option value="朋友">朋友</option>
                    <option value="同事">同事</option>
                    <option value="其他">其他</option>
                </select>
                <button class="btn btn-outline-secondary" type="button" id="searchButton">
                    <i class="fas fa-search me-1"></i>搜索
                </button>
            </div>
        </div>
    </div>

    <!-- 亲友列表 -->
    <div class="row">
        <div class="col-12">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>姓名</th>
                        <th>生日</th>
                        <th>标签</th>
                        <th>是否启用提醒</th>
                        <th>是否替我祝贺</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="relationshipTableBody">
                    <!-- 动态加载数据 -->
                    <tr>
                        <td colspan="6" class="text-center py-5">
                            <div class="spinner-border" role="status" style="color: #667eea;">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                            <p class="mt-3 text-muted">正在加载数据...</p>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 分页 -->
    <div class="row mt-3">
        <div class="col-12">
            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center" id="pagination">
                    <!-- 动态生成分页 -->
                </ul>
            </nav>
        </div>
    </div>
</div>

<!-- 添加/编辑亲友模态框 -->
<div class="modal fade" id="relationshipModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">添加亲友</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="relationshipForm">
                    <input type="hidden" id="id">
                    <div class="mb-3">
                        <label for="name" class="form-label">亲友姓名</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="myEmail" class="form-label">我的邮箱</label>
                        <input type="text" class="form-control" id="myEmail" required>
                    </div>
                    <div class="mb-3">
                        <label for="calendarType" class="form-label">日期类型</label>
                        <select class="form-select" id="calendarType">
                            <option value="0">公历</option>
                            <option value="1">农历</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="birthday" class="form-label">生日</label>
                        <input type="date" class="form-control" id="birthday">
                    </div>
                    <div class="mb-3">
                        <label for="tag" class="form-label">标签</label>
                        <select class="form-select" id="tag" required>
                            <option value="家人">家人</option>
                            <option value="朋友">朋友</option>
                            <option value="同事">同事</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="notes" class="form-label">备注</label>
                        <textarea class="form-control" id="notes" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="reminderEnabled" class="form-label">是否启用提醒</label>
                        <select class="form-select" id="reminderEnabled">
                            <option value="true">是</option>
                            <option value="false">否</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="congratulateEnabled" class="form-label">是否替我祝贺</label>
                        <select class="form-select" id="congratulateEnabled">
                            <option value="true">是</option>
                            <option value="false">否</option>
                        </select>
                        <div class="form-text">启用后，系统将在生日当天自动向亲友发送祝贺邮件</div>
                    </div>
                    <div class="mb-3" id="relationshipEmailGroup" style="display: none;">
                        <label for="relationshipEmail" class="form-label">亲友邮箱 <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="relationshipEmail" placeholder="请输入亲友的邮箱地址">
                        <div class="form-text">用于接收生日祝贺邮件</div>
                    </div>
                    <div class="mb-3" id="greetingGroup" style="display: none;">
                        <label for="greeting" class="form-label">招呼语</label>
                        <input type="text" class="form-control" id="greeting" placeholder="例如：亲爱的、尊敬的" maxlength="30">
                        <div class="form-text">邮件开头的称呼方式</div>
                    </div>
                    <div class="mb-3" id="selfCallGroup" style="display: none;">
                        <label for="selfCall" class="form-label">自称</label>
                        <input type="text" class="form-control" id="selfCall" placeholder="例如：你的朋友、小明" maxlength="20">
                        <div class="form-text">邮件结尾的署名</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">提前通知天数</label>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="daysBefore" value="1" id="days1">
                                <label class="form-check-label" for="days1">1天</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="daysBefore" value="3" id="days3">
                                <label class="form-check-label" for="days3">3天</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="daysBefore" value="7" id="days7">
                                <label class="form-check-label" for="days7">7天</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="daysBefore" value="15" id="days15">
                                <label class="form-check-label" for="days15">15天</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="daysBefore" value="30" id="days30">
                                <label class="form-check-label" for="days30">30天</label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveButton">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 页脚 -->
<footer class="py-4 mt-5">
    <div class="container text-center">
        <p class="mb-2" style="font-size: 1.1rem;">任何不曾起舞的日子，都是对生命的辜负</p>
        <p class="mb-0 small text-muted">© 2024 生日提醒系统 | 用心记住每一个重要时刻</p>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="/js/bootstrap.bundle.min.js"></script>
<!-- API JS -->
<script src="/js/api.js"></script>
<!-- 亲友管理JS -->
<script src="/js/ship.js"></script>
</body>
</html>
